<section id="servicios" class="max-w-7xl mx-auto py-20 md:py-24 px-4 sm:px-6 lg:px-8" aria-labelledby="servicios-heading">
  
  <div class="text-center mb-16 flex flex-col items-center">
    
    <span class="text-orange-700 font-bold tracking-wider uppercase text-sm mb-3">Lo que hacemos</span>
    
    <h2 id="servicios-heading" class="text-3xl md:text-4xl font-extrabold text-slate-800 tracking-tight">
      Servicios de especialización
    </h2>
    
    <div class="w-16 h-1 bg-orange-700 rounded-full mt-6"></div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 xl:gap-10">
    @for (item of servicios(); track item.id) {
      <app-card-servicio [servicio]="item"></app-card-servicio>
    }
  </div>

</section>
