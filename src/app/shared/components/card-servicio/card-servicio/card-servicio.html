<div class="card bg-base-100 shadow-md rounded-2xl border border-[#CDDEE5] hover:shadow-xl transition-shadow duration-300 flex flex-col h-full">
  <div class="rounded-2xl bg-white card-body items-center text-center p-8 flex flex-col flex-grow">
    
    <div class="p-4 bg-base-200 rounded-sm text-[#7296A4] mb-4 flex justify-center items-center">
      <i class="{{ servicio().icono }} text-4xl block"></i>
    </div>
    
    <h3 class="card-title text-xl font-bold mb-2 text-slate-800">{{ servicio().titulo }}</h3>
    
    <p class="text-gray-500 text-sm mb-6 flex-grow">{{ servicio().descripcion }}</p>
    
    <div class="flex flex-wrap gap-2 justify-center mt-auto">
      <span class="badge badge-neutral bg-[#7296A4] border-none text-white text-xs py-3 px-4 shadow-sm">
        {{ servicio().tecnologias }}
      </span>
    </div>

  </div>
</div>
