<article class="bg-white rounded-2xl shadow-sm hover:shadow-xl hover:-translate-y-2 transition-all duration-300 overflow-hidden border border-slate-100 flex flex-col h-full group">
    
    <div class="p-8 flex flex-col flex-grow items-center text-center">
        
        <div class="flex flex-col items-center w-full">
            <div class="w-16 h-16 bg-orange-50 rounded-2xl text-orange-700 mb-5 flex justify-center items-center group-hover:scale-110 transition-transform duration-300" aria-hidden="true">
                <i class="{{ servicio().icono }} text-4xl block"></i>
            </div>
            
            <h3 class="text-xl font-extrabold text-slate-800 mb-3 tracking-tight">
                {{ servicio().titulo }}
            </h3>
        </div>
        
        <p class="text-slate-600 text-sm mb-6 flex-grow leading-relaxed">
            {{ servicio().descripcion }}
        </p>
        
        <div class="flex flex-wrap gap-2 justify-center mt-auto pt-4 w-full border-t border-slate-50">
            <span class="bg-white border border-orange-200 text-orange-800 text-xs font-bold py-1.5 px-4 rounded-full shadow-sm">
                {{ servicio().tecnologias }}
            </span>
        </div>

    </div>
</article>
