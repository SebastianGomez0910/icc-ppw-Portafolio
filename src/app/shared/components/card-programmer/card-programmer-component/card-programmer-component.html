<div class="bg-white rounded-lg shadow-md overflow-hidden flex flex-col md:flex-row max-w-4xl mx-auto border border-gray-100">
    
    <div class="relative w-full md:w-1/2 h-64 md:h-auto">
        @if (programador().isActive) {
            <div class="absolute top-4 left-4 flex items-center gap-2 bg-white/90 backdrop-blur-sm px-3 py-1 rounded-full shadow-sm z-10">
                <span class="relative flex h-2.5 w-2.5">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-green-500"></span>
                </span>
                <span class="text-xs font-semibold text-gray-700">Disponible</span>
            </div>
        }
        
        <img 
            [src]="programador().profilePicture ? 'http://localhost:1337' + programador().profilePicture.url : 'https://ui-avatars.com/api/?name=' + programador().name" 
            [alt]="'Foto de ' + programador().name"
            class="w-full h-full object-cover absolute inset-0"
        >
    </div>

    <div class="p-8 w-full md:w-1/2 flex flex-col justify-center items-center text-center">
        
        <h3 class="text-2xl font-bold text-[#7296A4] mb-2">{{ programador().name }}</h3>
        <p class="text-gray-600 text-sm mb-6">{{ programador().shortDescription }}</p>

        <hr class="w-3/4 border-gray-200 mb-6">

        <div class="flex flex-col items-center gap-6">
            
            <div class="flex items-center justify-center gap-4 text-gray-500">
                <a [href]="programador().githubUrl" target="_blank" class="hover:text-gray-900 transition-colors" title="GitHub">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd" />
                    </svg>
                </a>
                
                <span class="text-gray-300 select-none">|</span>
                
                <a [href]="programador().linkedinUrl" target="_blank" class="hover:text-blue-600 transition-colors" title="LinkedIn">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path fill-rule="evenodd" d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" clip-rule="evenodd" />
                    </svg>
                </a>
            </div>

            <a [routerLink]="['/programador', programador().slug]"
               class="px-8 py-2 border-2 border-[#7296A4] text-[#7296A4] rounded-md hover:bg-[#7296A4] hover:text-white transition-all duration-300 font-semibold mt-2">
                Ver perfil
            </a>
            
            @if (authService.isLoggedIn()) {
            <a href="#contacto" class="btn btn-outline border-[#7296A4] text-[#7296A4] w-full mt-4">
                Contactar
            </a>
            } @else {
            <p class="text-xs text-center text-gray-400 mt-4">Inicia sesión para contactar</p>
            }
        </div>
    </div>
</div>
