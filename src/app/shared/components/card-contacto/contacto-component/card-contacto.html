<section class="py-20 px-4 sm:px-6 max-w-7xl mx-auto min-h-screen flex flex-col justify-center" id="contacto" aria-labelledby="contacto-heading">
  
  @if (cargando()) {
    <div class="flex justify-center items-center w-full min-h-[300px]" aria-live="polite">
        <span class="loading loading-spinner text-orange-700 loading-lg"></span>
        <span class="sr-only">Cargando formulario de contacto...</span>
    </div>
  } @else {
    
    <div class="max-w-5xl w-full bg-white rounded-3xl shadow-xl hover:shadow-2xl transition-shadow duration-500 overflow-hidden flex flex-col md:flex-row border border-slate-100 mx-auto">
      
      <aside class="md:w-5/12 bg-orange-700 p-10 md:p-12 text-white flex flex-col justify-between relative overflow-hidden">
        <div class="absolute top-0 right-0 w-64 h-64 bg-white/10 rounded-full blur-3xl -mr-16 -mt-16 pointer-events-none"></div>
        <div class="absolute bottom-0 left-0 w-40 h-40 bg-orange-900/20 rounded-full blur-2xl -ml-10 -mb-10 pointer-events-none"></div>

        <div class="relative z-10">
          <h2 id="contacto-heading" class="text-3xl md:text-4xl font-extrabold mb-4 tracking-tight text-white">Trabajemos juntos</h2>
          <p class="text-orange-100 text-base mb-8 leading-relaxed font-medium">
            Selecciona al programador ideal para tu proyecto y cuéntanos tu idea. Estamos listos para construir el código que necesitas.
          </p>
        </div>
        
        <div class="mt-10 md:mt-0 text-sm text-orange-50 flex items-center gap-3 relative z-10 bg-orange-800/60 p-4 rounded-xl border border-orange-600/50 shadow-inner">
          <p class="font-medium">Tu solicitud será enviada de forma segura.</p>
        </div>
      </aside>

      <div class="md:w-7/12 p-10 md:p-12 flex flex-col justify-center">
        <h3 class="text-2xl font-extrabold text-slate-800 mb-6 tracking-tight">Describe tu idea</h3>
        
        <form [formGroup]="contactoForm" (ngSubmit)="enviarMensaje()" class="flex flex-col gap-6">
          
          <div class="form-control">
            <label for="programadorId" class="label pb-2 cursor-pointer justify-start gap-1">
                <span class="label-text text-slate-700 font-bold">¿A quién va dirigida la solicitud?</span>
                <span class="text-orange-700 font-bold" aria-hidden="true">*</span>
            </label>
            <select 
              id="programadorId"
              formControlName="programadorId" 
              class="select bg-slate-50 border-slate-200 text-slate-700 w-full focus:bg-white focus:border-orange-700 focus:ring-2 focus:ring-orange-700/20 transition-all duration-300 rounded-xl">
              <option value="" disabled selected>Selecciona un programador</option>
              @for (prog of programadores(); track prog.id) {
                <option [value]="prog.id || prog.documentId">{{ prog.name || prog.nombre }}</option>
              }
            </select>
          </div>

          <div class="form-control">
            <label for="ideaProyecto" class="label pb-2 cursor-pointer justify-start gap-1">
                <span class="label-text text-slate-700 font-bold">¿De qué trata tu proyecto?</span>
                <span class="text-orange-700 font-bold" aria-hidden="true">*</span>
            </label>
            <textarea 
              id="ideaProyecto"
              formControlName="idea"
              class="textarea bg-slate-50 border-slate-200 text-slate-700 w-full h-32 focus:bg-white focus:border-orange-700 focus:ring-2 focus:ring-orange-700/20 transition-all duration-300 rounded-xl text-base resize-none" 
              placeholder="Ej: Necesito desarrollar una plataforma web para mi negocio..."></textarea>
          </div>
          
          <div class="pt-2">
            <button type="submit" 
                    class="w-full py-3.5 px-6 rounded-full font-bold text-lg tracking-wide transition-all duration-300 shadow-md flex justify-center items-center gap-2
                           bg-orange-700 text-white hover:bg-orange-800 hover:shadow-lg hover:-translate-y-0.5 focus:ring-4 focus:ring-orange-700/30
                           disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed disabled:shadow-none disabled:transform-none" 
                    [disabled]="contactoForm.invalid">
              Enviar Solicitud
            </button>
          </div>
        </form>
      </div>

    </div>
  }
</section>
