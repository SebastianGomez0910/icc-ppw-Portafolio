<section class="py-20 px-6 max-w-7xl mx-auto min-h-screen flex flex-col justify-center" id="contacto">
  
  @if (cargando()) {
    <div class="flex justify-center w-full"><span class="loading loading-spinner text-[#7296A4] loading-lg"></span></div>
  } @else {
    
    <div class="max-w-5xl w-full bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col md:flex-row border border-gray-100 mx-auto">
      
      <div class="md:w-5/12 bg-[#7296A4] p-10 text-white flex flex-col justify-between">
        <div>
          <h2 class="text-3xl font-bold mb-2">Trabajemos juntos</h2>
          <p class="text-white/80 text-sm mb-8">Selecciona al programador ideal para tu proyecto y cuéntanos tu idea. Estamos listos para empezar.</p>
        </div>
        
        <div class="mt-10 md:mt-0 text-sm text-white/70">
          <p>Tu solicitud será enviada de forma segura a nuestra base de datos.</p>
        </div>
      </div>

      <div class="md:w-7/12 p-10 flex flex-col justify-center">
        <h3 class="text-2xl font-bold text-gray-800 mb-6">Describe tu idea</h3>
        
        <form [formGroup]="contactoForm" (ngSubmit)="enviarMensaje()" class="flex flex-col">
          
          <div class="form-control mb-4">
            <label class="label"><span class="label-text text-gray-600 font-medium">¿A quién va dirigida la solicitud? *</span></label>
            <select formControlName="programadorId" class="select select-bordered w-full focus:border-[#7296A4]">
              <option value="" disabled selected>Selecciona un programador</option>
              @for (prog of programadores(); track prog.id) {
                <option [value]="prog.id || prog.documentId">{{ prog.name || prog.nombre }}</option>
              }
            </select>
          </div>

          <div class="form-control mb-6">
            <label class="label"><span class="label-text text-gray-600 font-medium">¿De qué trata tu proyecto? *</span></label>
            <textarea 
              formControlName="idea"
              class="textarea textarea-bordered w-full h-32 focus:border-[#7296A4] text-base resize-none" 
              placeholder="Ej: Necesito desarrollar una plataforma web para mi negocio..."></textarea>
          </div>
          
          <div class="flex gap-4 mt-2">
            <button type="submit" 
                    class="btn bg-[#7296A4] text-white hover:bg-[#5b7a87] flex-grow border-none" 
                    [disabled]="contactoForm.invalid">
              Enviar Solicitud
            </button>
          </div>
        </form>
      </div>

    </div>
  }
</section>
