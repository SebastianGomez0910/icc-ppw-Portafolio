<article class="bg-white rounded-2xl shadow-sm hover:shadow-xl transition-shadow duration-300 overflow-hidden border border-slate-100 flex flex-col h-full group">

    <header class="relative h-48 w-full overflow-hidden bg-slate-100">
        
        <div class="absolute top-3 right-3 bg-orange-700 text-white text-xs font-bold px-3 py-1 rounded-full z-10 shadow-sm">
            {{ proyecto().projectType }}
        </div>

        <img 
            [src]="proyecto().mainImage ? proyecto().mainImage.url : 'https://placehold.co/600x400/e2e8f0/475569?text=Proyecto'" 
            [alt]="'Imagen representativa del proyecto ' + proyecto().name"
            class="w-full h-full object-cover transition-transform duration-500 ease-out group-hover:-translate-y-2"
        >
    </header>

    <div class="p-6 flex flex-col flex-grow">
        
        <h3 class="text-xl font-extrabold text-slate-800 mb-2 tracking-tight">
            {{ proyecto().name }}
        </h3>
        
        <p class="text-slate-600 text-sm mb-5 flex-grow leading-relaxed">
            {{ proyecto().shortDescription }}
        </p>

        <div class="mb-5">
            <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Tecnologías:</h4>
            <p class="text-sm text-orange-800 font-medium">{{ proyecto().teechnologies }}</p>
        </div>

        <footer class="flex items-center justify-between mt-auto pt-4 border-t border-slate-100">
            
            <div class="flex gap-4">
                @if (proyecto().repositorioUrl) {
                    <a [href]="proyecto().repositorioUrl" target="_blank" class="text-slate-400 hover:text-slate-800 transition-colors" aria-label="Ver repositorio en GitHub" title="Ver Código">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd" /></svg>
                    </a>
                }
                
                @if (proyecto().demoUrl) {
                    <a [href]="proyecto().demoUrl" target="_blank" class="text-slate-400 hover:text-orange-700 transition-colors" aria-label="Ver demostración en vivo" title="Ver Demo">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                    </a>
                }
            </div>

            <a [routerLink]="['/proyecto', proyecto().slug]" class="text-sm font-bold text-orange-700 hover:text-orange-800 transition-colors flex items-center gap-1 group/link">
                Ver detalles
                <span class="transform transition-transform group-hover/link:translate-x-1">→</span>
            </a>
            
        </footer>
    </div>
</article>
